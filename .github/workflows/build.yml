name: Build and test (Windows)

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Also publish this build as a GitHub pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $base = $props.Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+.*)$') {
            $version = $Matches[1]
          } else {
            $version = "$base-ci.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Restore
        run: dotnet restore Akeno.ColorVision.sln

      - name: Build (Release)
        run: dotnet build Akeno.ColorVision.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Check XAML resource references
        run: python scripts/check-xaml-resources.py

      - name: Unit tests
        run: dotnet test tests/Akeno.ColorVision.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Integration tests (real Windows APIs)
        run: dotnet test tests/Akeno.ColorVision.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --logger "console;verbosity=detailed" --results-directory TestResults

      - name: Preset evaluation (simulation model)
        run: dotnet run --project tools/Akeno.ColorVision.PresetLab -c Release --no-build -- markdown

      - name: Package portable ZIP
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Build installer (Inno Setup)
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
            $path = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $path) {
              choco install innosetup -y --no-progress | Out-Host
              $path = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
          } else { $path = $iscc.Source }
          if (-not $path) { throw "Inno Setup is not available." }
          & $path "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=..\dist\Akeno-ColorVision" installer\AkenoColorVision.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed." }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Akeno-ColorVision-v${{ steps.version.outputs.version }}-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Upload installer
        if: steps.installer.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Akeno-ColorVision-Setup-v${{ steps.version.outputs.version }}
          path: dist/*Setup*.exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish GitHub release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.prerelease)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$version" }
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -like "*.zip" -or $_.Name -like "*.sha256" -or $_.Name -like "*Setup*.exe" } | ForEach-Object { $_.FullName })
          $notes = Get-Content docs/RELEASE-NOTES.md -Raw
          $flags = @("--title", "Akeno ColorVision $version", "--notes", $notes, "--target", "${{ github.sha }}")
          if ($version -match '-' -or "${{ github.event_name }}" -eq "workflow_dispatch") { $flags += "--prerelease" }
          gh release create $tag @files @flags
